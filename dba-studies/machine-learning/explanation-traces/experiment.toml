[experiment]
id = "credit-constraint-explanation-v1"
research_question = "How does a tighter firm loan-to-value limit propagate through credit allocation, employment, production constraints, household outcomes, and real GDP?"
calibration = "AUSTRIA2010Q1"
horizon = 12
seeds = [4101, 4102, 4103]
shock = "none"
outcomes = ["real_gdp", "unemployment_rate", "household_income_gini"]
mechanisms = ["credit_allocation", "employment", "production_constraints"]

[[scenarios]]
id = "baseline"
role = "baseline"
description = "Unmodified Austrian 2010Q1 calibration."

[[scenarios]]
id = "tighter-firm-loan-to-value-limit"
role = "intervention"
description = "Firm loan-to-value limit zeta_LTV multiplied by 0.5 before model construction."

[[scenarios.changes]]
parameter = "zeta_LTV"
operation = "multiply"
value = 0.5
