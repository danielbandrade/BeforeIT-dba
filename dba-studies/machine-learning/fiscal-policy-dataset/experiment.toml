[experiment]
source = "bundled" # Austrian calibration included with BeforeIT
scale = 0.001
configurations = 100 # baseline + 8 one-variable boundaries + 91 LHS points
seeds = 5
horizon = 12
master_seed = 2026
output_dir = "experiments/austria-scale-0.001-zero-to-double"

[bounds]
# For each parameter, from zero to twice its Austrian baseline.
relative_to_baseline = [0.0, 2.0]
